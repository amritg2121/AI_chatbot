<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ChatBot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <div class="ai-chat-box">
            <img src="aibot.png" alt="AI bot" id="aiImage" width="10%">
            <div class="ai-chat-area">
                Hello! How Can I Help You?
            </div>
        </div>
    </div>
    <div class="prompt-area">
        <input type="text" id="prompt" placeholder="Message..." autocomplete="off">
        <button id="image" type="button" aria-label="Attach image"><img src="img.svg" alt=""></button>
        <input type="file" id="imageInput" accept="image/*" hidden>
        <button id="submit" type="button" aria-label="Send"><img src="submit.svg" alt=""></button>
    </div>
    <script src="script.js"></script>
</body>
</html>
